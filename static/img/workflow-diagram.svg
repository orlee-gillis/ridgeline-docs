<svg viewBox="0 0 1100 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .circle {
        fill: #6366f1;
        stroke: #6366f1;
        stroke-width: 2;
      }
      .number {
        fill: white;
        font-size: 24px;
        font-weight: bold;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .label {
        fill: #1f2937;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
      }
      .line {
        stroke: #d1d5db;
        stroke-width: 2;
        fill: none;
      }
    </style>
  </defs>

  <!-- Connecting lines -->
  <line class="line" x1="150" y1="50" x2="250" y2="50"/>
  <line class="line" x1="350" y1="50" x2="450" y2="50"/>
  <line class="line" x1="550" y1="50" x2="650" y2="50"/>
  <line class="line" x1="750" y1="50" x2="850" y2="50"/>
  <line class="line" x1="950" y1="50" x2="1050" y2="50"/>

  <!-- Step 1: Legacy Pages -->
  <circle class="circle" cx="100" cy="50" r="35"/>
  <text class="number" x="100" y="50">1</text>
  <text class="label" x="100" y="110">Legacy</text>
  <text class="label" x="100" y="128">Pages</text>

  <!-- Step 2: Audit -->
  <circle class="circle" cx="300" cy="50" r="35"/>
  <text class="number" x="300" y="50">2</text>
  <text class="label" x="300" y="110">Audit</text>

  <!-- Step 3: Improved Pages -->
  <circle class="circle" cx="500" cy="50" r="35"/>
  <text class="number" x="500" y="50">3</text>
  <text class="label" x="500" y="110">Improved</text>
  <text class="label" x="500" y="128">Pages</text>

  <!-- Step 4: AI Drafting -->
  <circle class="circle" cx="700" cy="50" r="35"/>
  <text class="number" x="700" y="50">4</text>
  <text class="label" x="700" y="110">AI</text>
  <text class="label" x="700" y="128">Drafting</text>

  <!-- Step 5: Gates -->
  <circle class="circle" cx="900" cy="50" r="35"/>
  <text class="number" x="900" y="50">5</text>
  <text class="label" x="900" y="110">Gates</text>

  <!-- Step 6: Skills Evaluation -->
  <circle class="circle" cx="1100" cy="50" r="35"/>
  <text class="number" x="1100" y="50">6</text>
  <text class="label" x="1100" y="110">Skills</text>
  <text class="label" x="1100" y="128">Eval</text>
</svg>
